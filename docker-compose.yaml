  mongodb:
    image: mongodb/mongodb-atlas-local
    hostname: mongodb
    container_name: mongodb
    env_file:
      - .env.docker
    ports:
      - 27017:27017
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
    healthcheck:
      test: 'mongosh --exec "db.runCommand({ ping: 1 })" --quiet || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  traggo:
    image: traggo/server:latest
    ports:
      - 3030:3030
    volumes:
      - ./traggodata:/opt/traggo/data
volumes:
  db:
  configdb:
  mongot: