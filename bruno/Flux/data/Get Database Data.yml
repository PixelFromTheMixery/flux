info:
  name: Get Database Data
  type: http
  seq: 1
  tags:
    - data
    - get

http:
  method: GET
  url: "{{baseUrl}}/data/all"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/data/all"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |-
  Endpoint for fetching database data
  Returns:
      dict: database contents
