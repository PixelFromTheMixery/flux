info:
  name: Get Database Entry
  type: http
  seq: 3
  tags:
    - data
    - get

http:
  method: GET
  url: "{{baseUrl}}/data/:group/:name"
  params:
    - name: group
      value: ""
      type: path
    - name: name
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/data/:group/:name"
      method: GET
      params:
        - name: group
          value: ""
          type: path
        - name: name
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "_id": "",
            "name": "",
            "group": "",
            "integrations": {
              "traggo": "",
              "sp": "",
              "anytype": ""
            }
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/data/:group/:name"
      method: GET
      params:
        - name: group
          value: ""
          type: path
        - name: name
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
