[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "flux"
version = "0.1.0"
description = "Productivity integration and automation tool"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache 2.0"}
authors = [
    {name = "Aya Jackson", email = "pixelmixery@gmail.com"}
]
keywords = ["anytype", "super-Productivity", "traggo", "api", "fastapi"]

# Core dependencies (Third-party packages only)
dependencies = [
    "fastapi",            # Web framework
    "pydantic",           # Data validation
    "pydantic_settings",  # Singleton
    "uvicorn",            # ASGI server
    "requests",           # HTTP calls
    "python-dateutil",    # relativedelta
    "python-dotenv",      # load_dotenv
    "pyyaml",             # YAML support
    "python-json-logger", # Structured logging
    "pytokens",           # Used in AnyTypeUtils
    "apscheduler",        # Background jobs
]

# uv sync --extra dev
[project.optional-dependencies]
dev = [
    "black",              # Code formatter
    "ruff",               # Fast linting  
    "pytest",             # Testing framework
    "pylint-pytest"       # Prevent Pylint from worrying about pytest
]

[tool.pylint.MASTER]
load-plugins = "pylint_pytest"

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "no-member",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true

[pytest]
addopts = "-ra -q"