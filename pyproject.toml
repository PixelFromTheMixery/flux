[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "flux"
version = "0.1.0"
description = "Productivity integration and automation tool"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache 2.0"}
authors = [
    {name = "Aya Jackson", email = "pixelmixery@gmail.com"}
]
keywords = ["anytype", "super-Productivity", "traggo", "api", "fastapi"]

# Core dependencies (Third-party packages only)
dependencies = [
    "apscheduler",        # Background jobs
    "beanie",             # Mongo interaction
    "cryptography",       # en/decryption of stored keys
    "fastapi",            # Web framework
    "pydantic",           # Data validation
    "pydantic_settings",  # Singleton
    "python-dateutil",    # relativedelta
#    "pytokens",           # Used in AnyTypeUtils
    "pyyaml",             # YAML support
    "requests",           # HTTP calls
    "uvicorn",            # ASGI server
]

# uv sync --extra dev
[project.optional-dependencies]
dev = [
    "black",                    # Code formatter
    "ruff",                     # Fast linting  
    "httpx",                    # Required for router tests
    "testcontainers[mongodb]",  # Required for mongo tests
    "pytest",                   # Testing framework
    "pytest-asyncio",           # Async test
    "pytest-cov",               # Test Coverage
    "pylint-pytest",            # Prevent Pylint from worrying about pytest
]

[tool.pylint.MASTER]
load-plugins = "pylint_pytest"

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "no-member",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["/app"]
markers = [
  "read: tests that validate read-only behavior",
  "integration: integration tests"
]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
